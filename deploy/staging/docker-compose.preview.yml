services:
  web:
    image: hirearchy/web:${HIREARCHY_RELEASE_SHA:?set HIREARCHY_RELEASE_SHA to the checked-out commit}
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile.web
    network_mode: host
    restart: unless-stopped
    user: '1000:1000'
    environment:
      NODE_ENV: production
      PORT: ${PREVIEW_APP_PORT:?set PREVIEW_APP_PORT}
      HOSTNAME: 127.0.0.1
      NODE_OPTIONS: --max-old-space-size=512
      HIREARCHY_RUNTIME_PROFILE: public-preview
      HIREARCHY_TRUSTED_PROXY_HOPS: '${HIREARCHY_TRUSTED_PROXY_HOPS:-0}'
      EARLY_ACCESS_STORAGE_PATH: /app/data/early-access-requests.json
    volumes:
      - early-access-data:/app/data
    healthcheck:
      test:
        [
          CMD-SHELL,
          'node -e "fetch(''http://127.0.0.1:'' + process.env.PORT + ''/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: &rotated-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    network_mode: host
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:?set CADDY_HTTP_PORT (80 for deployment)}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:?set CADDY_HTTPS_PORT (443 for deployment)}
      PREVIEW_APP_PORT: ${PREVIEW_APP_PORT:?set PREVIEW_APP_PORT}
      PUBLIC_HOSTNAME: ${PREVIEW_HOSTNAME:?set PREVIEW_HOSTNAME}
    volumes:
      - ./Caddyfile.preview:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    cpus: 0.2
    mem_limit: 128m
    pids_limit: 64
    logging: *rotated-logs

volumes:
  early-access-data:
  caddy-data:
  caddy-config:
