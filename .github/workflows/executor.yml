name: Executor PostgreSQL checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/executor-public-review'

permissions:
  contents: read

concurrency:
  group: executor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm audit --audit-level=high

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull pinned PostgreSQL fixture
        run: docker pull postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
      - name: Run executor PostgreSQL and admission tests
        run: >-
          node --test --test-concurrency=1
          --test-name-pattern='fixed recipe argument arrays|canonical snapshots|PostgreSQL-only simulation'
          tests/restricted-executor/acceptance.test.mjs

  real-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull pinned PostgreSQL fixture
        run: docker pull postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
      - name: Pull reviewed executor image
        run: docker pull assess-python@sha256:892c8fa7563e6054fb17fa6a729be7dcbeb87f9268da5533f06bde4a8e8d1b3d
      - run: node scripts/test-restricted-executor.mjs
      - run: node scripts/test-restricted-executor-dispatch.mjs
      - run: node --test --test-concurrency=1 tests/restricted-executor/service.test.mjs
