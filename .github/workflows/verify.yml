name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build disposable scenario image
        run: |
          docker build -t hirearchy-musl-builder:3.20 -f scenarios/001-cache-staleness/Dockerfile.ci-builder .
          docker build -t hirearchy-scenario-001-test:latest -f scenarios/001-cache-staleness/Dockerfile.ci-base .
          docker build -t hirearchy-scenario-001:latest scenarios/001-cache-staleness
          docker build -t hirearchy-scenario-002:v1.0.0 scenarios/002-booking-notification-retry
      - name: Check formatting, lint, types, tests, and build
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Check existing scenario runtimes
        run: HIREARCHY_DOCKER_SCENARIO_TEST=1 npx vitest run tests/integration/scenario-002-docker-readiness.test.ts
